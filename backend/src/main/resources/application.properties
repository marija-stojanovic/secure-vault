spring.application.name=secure-vault-backend

# Google OIDC je podrazumijevani profil, pa je za lokalno pokretanje dovoljan
# samo "mvn spring-boot:run". Drugi profil se po potrebi i dalje moze eksplicitno izabrati.
spring.profiles.default=oidc

server.port=${SERVER_PORT:8444}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.ssl.enabled=true
server.ssl.key-store=classpath:tls/backend.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${BACKEND_TLS_KEYSTORE_PASSWORD:securevault}
server.ssl.key-alias=backend
server.forward-headers-strategy=framework

# Lokalna razvojna konekcija prema jednoj secure_vault bazi.
# U produkciji bi MySQL veza koristila TLS i lozinka bi bila izvan izvornog koda.
spring.datasource.url=jdbc:mysql://localhost:3306/secure_vault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:secure_vault_app}
spring.datasource.password=sigurnost
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Potpuno odvojena konekcija za namjerno ranjivi honeypot demo. Ovaj MySQL nalog
# mora imati samo SELECT pravo nad secure_vault.honeytokens (nikako nad cijelom semom).
app.honeypot.demo-datasource.url=${HONEYPOT_DB_URL:jdbc:mysql://localhost:3306/secure_vault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&allowMultiQueries=false}
app.honeypot.demo-datasource.username=${HONEYPOT_DB_USERNAME:secure_vault_honeypot_demo}
app.honeypot.demo-datasource.password=${HONEYPOT_DB_PASSWORD:honey_demo_sigurnost_2026}

# Hibernate samo provjerava da postojeca sema odgovara JPA entitetima. Aplikacijski
# MySQL nalog ima iskljucivo CRUD prava i zato ne smije automatski mijenjati semu.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Redis je zajednički sa Gatewayem; backend ga koristi pri Admin odblokiranju IP adrese.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never

# Lokalni razvojni kljuc za sifrovanje TOTP seed-a. Za produkciju se zamjenjuje
# environment varijablom MFA_ENCRYPTION_KEY_BASE64.
app.security.mfa-encryption-key-base64=${MFA_ENCRYPTION_KEY_BASE64:UaMfQKzVxA6s9hyFexBNlkV9qAw+y+sh2/L/BIaJfKA=}
app.security.totp-issuer=SecureVault
app.security.mfa-challenge-lifetime-seconds=300
app.security.cookie-secure=true
